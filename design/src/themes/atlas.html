<meta charset="utf-8">
<title>Ruled Notebook</title>
<meta name="description" content="Blog redesign: a dark-first reading notebook with an article timeline, short posts, and build-time equations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>__KATEX_CSS__</style>

<style>
/* ============================================================
   Dark is the default. The bare :root carries the complete dark
   palette, so an unstamped document (the "system" state) is dark
   regardless of OS preference. Light applies only when a viewer
   explicitly asks for it via [data-theme="light"].
   ============================================================ */
:root {
  --paper:#14161b; --paper-2:#1a1d24; --paper-3:#212630; --card:#171a20;
  --rule:#2d323c; --rule-soft:#232833; --rule-hair:#1c2028;
  --ink:#dcd7cb; --ink-strong:#f4f1e8; --ink-soft:#9d9b92; --ink-faint:#71757c;
  --accent:#7fb4f0; --accent-soft:#1b2a3c;
  --vermilion:#e08a76; --moss:#8fb37c;
  --serif:"Newsreader",Georgia,"Songti SC","Source Han Serif SC",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --cjk:"Songti SC","Source Han Serif SC","PingFang SC","Microsoft YaHei";
  --measure:34em; --rail:214px; --marg:172px;
  color-scheme:dark;
}
:root[data-theme="light"] {
  --paper:#f8faf8; --paper-2:#eff2f0; --paper-3:#e6eae7; --card:#ffffff;
  --rule:#d3dad5; --rule-soft:#e2e7e3; --rule-hair:#ecf0ed;
  --ink:#1f2522; --ink-strong:#0b100e; --ink-soft:#54605a; --ink-faint:#87938c;
  --accent:#1b4b86; --accent-soft:#e4ecf6;
  --vermilion:#a53a2b; --moss:#40643a;
  color-scheme:light;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:17px;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(to bottom,transparent 0 33px,var(--rule-hair) 33px 34px);
}
body>*{position:relative;z-index:1}
a{color:var(--accent);text-decoration:none;text-underline-offset:2px}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--accent-soft)}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px}
.lbl{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--ink-faint)}
.num{font-variant-numeric:tabular-nums}

/* ---------- masthead ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
}
.topin{max-width:1180px;margin:0 auto;padding:0 26px;display:flex;align-items:center;gap:20px;min-height:56px}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark a{color:var(--ink-strong);font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.012em}
.mark span{
  font-family:var(--sans);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-faint);border-left:1px solid var(--rule);padding-left:9px;
}
.nav{display:flex;gap:2px;flex:1}
.nav a{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-soft);padding:5px 11px;border-radius:5px}
.nav a:hover{background:var(--paper-3);color:var(--ink-strong);text-decoration:none}
.nav a.on{color:var(--ink-strong);background:var(--paper-3)}
.act{display:flex;align-items:center;gap:7px;flex:none}
.mini{font-family:var(--sans);font-size:11.5px;color:var(--ink-soft);border:1px solid var(--rule);border-radius:5px;padding:3px 9px;background:var(--card);display:inline-flex;align-items:center;gap:6px;line-height:1}
.mini:hover{color:var(--ink-strong);border-color:var(--ink-faint)}
.lsw{display:flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;background:var(--card)}
.lsw button{font-family:var(--sans);font-size:11.5px;padding:3px 9px;color:var(--ink-soft)}
.lsw button.on{background:var(--accent);color:var(--paper);font-weight:600}

.page{max-width:1180px;margin:0 auto;padding:34px 26px 40px}
h1.big{font-family:var(--serif);font-size:31px;line-height:1.14;letter-spacing:-.022em;margin:0 0 9px;color:var(--ink-strong);font-weight:600;text-wrap:balance}
p.lede{font-size:17.5px;line-height:1.58;color:var(--ink-soft);margin:0;max-width:56ch}
.sechead{display:flex;align-items:baseline;gap:12px;margin:0 0 4px}
.sechead::after{content:"";flex:1;height:1px;background:var(--rule)}

/* ---------- home: 3/4 article timeline, 1/4 short posts ---------- */
.home{display:grid;grid-template-columns:3fr 1fr;gap:42px;margin-top:32px;align-items:start}
.home>.side{border-left:1px solid var(--rule);padding-left:22px;position:sticky;top:82px;max-height:calc(100vh - 110px);overflow:auto}
@media (max-width:940px){
  .home{grid-template-columns:1fr;gap:34px}
  .home>.side{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:22px;position:static;max-height:none}
}

.stream{border-top:1px solid var(--rule);margin-top:10px}
.item{
  display:grid;grid-template-columns:92px minmax(0,1fr);gap:20px;
  padding:15px 4px;border-bottom:1px solid var(--rule-soft);align-items:baseline;
}
.item:hover{background:var(--paper-2)}
.item .when{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
.item a.t{font-family:var(--serif);font-size:19.5px;font-weight:600;color:var(--ink-strong);line-height:1.3;letter-spacing:-.014em;display:block}
.item a.t:hover{color:var(--accent);text-decoration:none}
.item .sub{margin:3px 0 0;font-size:15px;color:var(--ink-soft);line-height:1.48;max-width:64ch}
.item .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:7px;font-family:var(--sans);font-size:11.5px;color:var(--ink-faint)}
.item .row .dot{width:6px;height:6px;border-radius:50%;display:block;flex:none}
.item .row .sep{color:var(--rule)}
.item .row .eq{color:var(--vermilion)}
.item .row a{color:var(--ink-faint)}
.item .row a:hover{color:var(--ink-strong);text-decoration:none}
.tag{font-family:var(--sans);font-size:11px;color:var(--ink-faint);border-bottom:1px dotted var(--rule)}
.tag:hover{color:var(--ink-strong);text-decoration:none}
.pill{font-family:var(--sans);font-size:11px;letter-spacing:.01em;font-weight:500;padding:1.5px 7px;border-radius:3px}
.pill.ser{color:var(--vermilion);background:color-mix(in srgb,var(--vermilion) 15%,transparent)}

/* short-post column */
.notes{border-top:1px solid var(--rule);margin-top:10px}
.note{padding:12px 0;border-bottom:1px solid var(--rule-soft)}
.note .w{font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);letter-spacing:.02em}
.note .bd{margin-top:4px}
.note .bd p{margin:0;font-size:14px;line-height:1.55;color:var(--ink)}
.note .bd[lang="zh"] p{font-family:var(--serif),var(--cjk);line-height:1.72}
.note .bd :not(pre)>code{font-family:var(--mono);font-size:.82em;background:var(--paper-3);padding:1px 4px;border-radius:3px;color:var(--vermilion)}
.note .bd .code-block{font-size:11px;padding:9px 11px;margin:8px 0 0}
.note .katex{font-size:.96em}
.morelink{display:inline-block;margin-top:14px;font-family:var(--sans);font-size:12px}

/* ---------- filters ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 6px}
.chip{
  font-family:var(--sans);font-size:12px;color:var(--ink-soft);border:1px solid var(--rule);
  border-radius:99px;padding:3px 12px;background:var(--card);display:flex;align-items:center;gap:7px;
}
.chip i{width:6px;height:6px;border-radius:50%;display:block}
.chip b{color:var(--ink-faint);font-weight:400;font-family:var(--mono);font-size:10.5px}
.chip:hover{border-color:var(--ink-faint);color:var(--ink-strong)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
.chip.on b{color:var(--paper)}

.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:6px}
.card{border:1px solid var(--rule);border-radius:8px;padding:14px 16px;background:var(--card);color:inherit;display:block}
.card:hover{border-color:var(--accent);text-decoration:none;background:var(--paper-2)}
.card h3{margin:0 0 5px;font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink-strong);letter-spacing:-.012em}
.card p{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.5}
.card .n{float:right;font-family:var(--mono);font-size:10.5px;color:var(--ink-faint)}

/* ---------- article ---------- */
.prog{position:fixed;top:56px;left:0;height:2px;background:var(--accent);z-index:45;transition:width .1s linear}
.post{display:grid;grid-template-columns:var(--rail) minmax(0,var(--measure)) var(--marg);gap:40px;align-items:start;margin-top:6px}
.doc2{display:grid;grid-template-columns:minmax(0,var(--measure)) var(--marg);gap:40px;align-items:start;margin-top:20px}
@media (max-width:1120px){.doc2{grid-template-columns:1fr}}
@media (max-width:1120px){
  .post{grid-template-columns:1fr}
  .rail{position:static!important;max-height:none!important;margin-bottom:26px}
  .marg{display:none}
}
.rail{position:sticky;top:82px;max-height:calc(100vh - 112px);overflow:auto;font-family:var(--sans);font-size:12.5px}
.rail section{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--rule-soft)}
.rail section:last-child{border-bottom:0;padding-bottom:0}
.rail h6{margin:0 0 9px}
.rail ol{list-style:none;margin:0;padding:0}
.rail li a{display:block;padding:3px 0 3px 11px;color:var(--ink-soft);border-left:2px solid var(--rule-soft);line-height:1.4}
.rail li a:hover{color:var(--ink-strong);text-decoration:none;border-left-color:var(--ink-faint)}
.rail li a.cur{color:var(--accent);border-left-color:var(--accent);font-weight:600}
.rail li.d3 a{padding-left:22px;font-size:11.5px}
.eqlist{display:grid;gap:5px}
.eqlist a{
  border:1px solid var(--rule-soft);border-radius:5px;padding:5px 8px;background:var(--card);
  display:flex;align-items:center;gap:8px;max-height:44px;overflow:hidden;
}
.eqlist a:hover{border-color:var(--accent)}
.eqlist a .n{flex:none;color:var(--ink-faint);font-family:var(--mono);font-size:10px}
.eqlist a .k{min-width:0;overflow:hidden;max-height:38px;
  mask-image:linear-gradient(to bottom,#000 0 26px,transparent 38px);
  -webkit-mask-image:linear-gradient(to bottom,#000 0 26px,transparent 38px)}
.eqlist .katex{font-size:.64em}

.ahead{margin-bottom:26px}
.ahead .over{display:flex;gap:11px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.ahead h1{font-family:var(--serif);font-size:36px;line-height:1.12;letter-spacing:-.024em;margin:0 0 11px;color:var(--ink-strong);font-weight:600;text-wrap:balance}
.ahead .st{font-family:var(--serif);font-size:19px;line-height:1.44;color:var(--ink-soft);margin:0 0 18px;font-style:italic}
.ameta{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:11px 0;font-family:var(--sans);font-size:11.5px;color:var(--ink-soft)}
.ameta>*{padding-right:20px;margin-right:20px;border-right:1px solid var(--rule-soft)}
.ameta>*:last-child{border-right:0;margin-right:0;padding-right:0}
.ameta b{display:block;font-family:var(--mono);font-size:14px;color:var(--ink-strong);font-weight:500;font-variant-numeric:tabular-nums}
.ameta button{display:block;text-align:left;padding:0;color:inherit}
.ameta button b{color:var(--accent);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.ameta button:hover b{text-decoration-style:solid}
.notice{margin:16px 0 0;border-left:3px solid var(--vermilion);padding:9px 14px;background:var(--paper-2);font-family:var(--sans);font-size:13px}
.notice b{color:var(--vermilion)}
.modes{display:flex;align-items:center;gap:10px;margin:18px 0 0;font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);flex-wrap:wrap}
.modes .grp{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--card)}
.modes button{padding:4px 13px;font-family:var(--sans);font-size:12px;color:var(--ink-soft);border-right:1px solid var(--rule-soft)}
.modes button:last-child{border-right:0}
.modes button.on{background:var(--ink-strong);color:var(--paper);font-weight:600}

/* prose */
.prose{font-size:17.5px;line-height:1.68;color:var(--ink)}
.prose[lang="zh"]{font-family:var(--serif),var(--cjk);line-height:1.86}
.prose>*{max-width:100%}
.prose h1{font-family:var(--serif);font-size:28px;margin:2em 0 .55em;letter-spacing:-.02em;color:var(--ink-strong);font-weight:600}
.prose h2{font-family:var(--serif);font-size:23px;margin:2.1em 0 .6em;letter-spacing:-.017em;color:var(--ink-strong);font-weight:600;position:relative}
.prose h2::before{content:"";position:absolute;left:-36px;top:.62em;width:22px;height:1px;background:var(--vermilion)}
.prose h3{font-family:var(--sans);font-size:14.5px;font-weight:600;letter-spacing:.02em;margin:1.8em 0 .5em;color:var(--ink-strong)}
.prose h4{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin:1.6em 0 .4em;color:var(--ink-faint)}
.prose p{margin:0 0 1.02em}
.prose>p:first-of-type::first-letter{float:left;font-family:var(--serif);font-size:3em;line-height:.87;font-weight:600;padding:.06em .09em 0 0;color:var(--ink-strong)}
.prose[lang="zh"]>p:first-of-type::first-letter{float:none;font-size:1em;padding:0}
.prose strong{font-weight:650;color:var(--ink-strong)}
.prose ul,.prose ol{margin:0 0 1.1em;padding-left:1.35em}
.prose li{margin:.32em 0}
.prose li::marker{color:var(--vermilion)}
.prose hr{border:0;border-top:1px solid var(--rule);margin:2.2em 0;max-width:110px}
.prose blockquote{margin:1.4em 0;padding-left:17px;border-left:2px solid var(--vermilion);color:var(--ink-soft);font-style:italic}
.prose :not(pre)>code{font-family:var(--mono);font-size:.83em;background:var(--paper-3);border:1px solid var(--rule-soft);padding:1px 5px;border-radius:3px;color:var(--vermilion)}
.prose .tablewrap{overflow-x:auto;margin:1.7em 0;border-top:2px solid var(--ink-strong);border-bottom:1px solid var(--ink-strong)}
.prose table{border-collapse:collapse;font-family:var(--sans);font-size:13.5px;min-width:100%}
.prose th{text-align:left;padding:9px 15px 9px 0;border-bottom:1px solid var(--rule);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.prose td{padding:11px 15px 11px 0;border-bottom:1px solid var(--rule-hair);vertical-align:top;line-height:1.55}
.prose tr:last-child td{border-bottom:0}
.prose img,.prose video{max-width:100%;border:1px solid var(--rule)}
.prose audio{width:100%;max-width:460px}

.eqn{display:grid;grid-template-columns:minmax(0,1fr) 0;margin:1.5em 0;position:relative}
.eqn>.katex-display{margin:0;grid-column:1;overflow-x:auto;overflow-y:hidden;min-width:0;padding:3px 0}
.eqn-tag{position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);text-decoration:none}
.eqn-tag:hover{color:var(--accent);text-decoration:none}
.eqn:target>.katex-display,.eqn.flash>.katex-display{background:var(--accent-soft);border-radius:4px}
@media (max-width:1120px){.eqn-tag{position:static;transform:none;display:block;text-align:right;margin-top:2px}}
.texsrc{grid-column:1;margin:7px 0 0;padding:7px 10px;border:1px solid var(--rule-soft);border-radius:4px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);background:var(--paper-2);white-space:pre-wrap;word-break:break-word;user-select:all}
.katex{font-size:1.02em}

.code-block{
  position:relative;margin:1.5em 0;padding:15px 17px;overflow-x:auto;
  border:1px solid var(--rule);border-left:2px solid var(--ink-faint);
  font-family:var(--mono);font-size:12.8px;line-height:1.6;
  background:var(--paper-2)!important;color:var(--ink)!important;
}
.code-block code{font-family:inherit}
.code-block::before{content:attr(data-lang);position:absolute;top:0;right:0;padding:2px 8px;font-family:var(--sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);background:var(--paper-3)}
.copybtn{position:absolute;top:5px;right:56px;font-family:var(--sans);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);border:1px solid var(--rule);padding:1px 7px;background:var(--card);opacity:0;transition:.15s}
.code-block:hover .copybtn,.copybtn:focus{opacity:1}
.copybtn.ok{color:var(--moss);border-color:var(--moss)}
.code-block span{color:var(--sh-dark)}
:root[data-theme="light"] .code-block span{color:var(--sh-light)}

details.deeper{margin:1.6em 0;padding:0 0 0 18px;border-left:1px solid var(--rule)}
details.deeper>summary{cursor:pointer;list-style:none;font-family:var(--sans);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--vermilion);display:flex;align-items:center;gap:8px;padding:2px 0}
details.deeper>summary::-webkit-details-marker{display:none}
details.deeper>summary::after{content:"＋";font-size:12px;color:var(--ink-faint);letter-spacing:0}
details.deeper[open]>summary::after{content:"−"}
details.deeper>summary:hover{color:var(--ink-strong)}
details.deeper[open]{background:var(--paper-2);border-left-color:var(--vermilion);padding:2px 16px 2px 18px}
details.deeper>*:not(summary):first-of-type{margin-top:.8em}

.sn{counter-increment:sn;position:relative}
.sn::after{content:counter(sn);font-family:var(--sans);font-size:.62em;vertical-align:super;color:var(--vermilion);font-weight:600;padding-left:1px}
.snote{float:right;clear:right;width:var(--marg);margin:.25em calc(-1 * (var(--marg) + 40px)) .8em 0;font-family:var(--sans);font-size:12.5px;line-height:1.5;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:6px}
.snote b{color:var(--vermilion);font-weight:600}
@media (max-width:1120px){.snote{float:none;width:auto;margin:.7em 0 1em;border-left:2px solid var(--rule);border-top:0;padding:2px 0 2px 12px}}

.prose[data-mode="skim"]>*:not(.keep){display:none}
.skimnote{display:none;font-family:var(--sans);font-size:12px;color:var(--ink-faint);border:1px dashed var(--rule);padding:8px 12px;margin:0 0 22px;background:var(--paper-2)}
.prose[data-mode="skim"] .skimnote{display:block}

/* interactive figure */
.figure{margin:2em 0;border-top:2px solid var(--ink-strong);border-bottom:1px solid var(--rule)}
.figure .fh{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-faint)}
.figure .fh .sp{flex:1}
.figure .fh em{font-style:normal;color:var(--moss)}
.figure .fb{padding:14px 0 4px}
.figure svg{display:block;width:100%;height:auto;overflow:visible}
.ctrls{display:flex;gap:24px;flex-wrap:wrap;padding:6px 0 12px;font-family:var(--sans);font-size:11.5px}
.ctrl{display:flex;flex-direction:column;gap:5px;min-width:155px;flex:1}
.ctrl label{color:var(--ink-soft);display:flex;justify-content:space-between;gap:10px}
.ctrl label b{font-family:var(--mono);color:var(--accent);font-weight:600}
.ctrl input[type=range]{width:100%;accent-color:var(--accent);height:15px}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 0 12px;font-family:var(--sans);font-size:11px}
.legend button{display:flex;align-items:center;gap:6px;color:var(--ink-soft)}
.legend button.off{opacity:.35;text-decoration:line-through}
.legend i{width:16px;height:3px;display:block}
.figcap{padding:11px 0 13px;font-size:14.5px;color:var(--ink-soft);line-height:1.55;border-top:1px solid var(--rule-hair)}
.figcap b{color:var(--ink-strong);font-weight:650}

.marg{position:sticky;top:82px;font-family:var(--sans);font-size:12px;color:var(--ink-faint)}
.marg .blk{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--rule-soft)}
.marg .blk:last-child{border-bottom:0}
.marg b{display:block;font-family:var(--mono);font-size:15px;color:var(--ink-strong);font-weight:500;font-variant-numeric:tabular-nums}

.xref{border-bottom:1px dotted var(--accent);cursor:help}
.hcard{position:fixed;z-index:70;max-width:min(440px,86vw);padding:12px 14px;background:var(--card);border:1px solid var(--rule);box-shadow:0 14px 36px -14px #0009;display:none}
.hcard.on{display:block}
.hcard .cl{font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px}
.hcard>div{overflow-x:auto}
.hcard .katex-display{margin:0}

/* article footer: reads, comments, citation */
.tally{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline;margin:34px 0 0;padding-top:14px;border-top:1px solid var(--rule);font-family:var(--sans);font-size:12.5px;color:var(--ink-faint)}
.tally b{font-family:var(--mono);font-size:15px;color:var(--ink-strong);font-weight:500;font-variant-numeric:tabular-nums}
.tally .src{margin-left:auto;font-size:11px}

.cmts{margin:30px 0 0;padding-top:18px;border-top:1px solid var(--rule)}
.cmts h3{margin:0 0 4px;font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink-strong)}
.cmts .cn{margin:0 0 16px;font-family:var(--sans);font-size:12px;color:var(--ink-faint)}
.cmt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid var(--rule-soft)}
.av{width:32px;height:32px;border-radius:50%;background:var(--paper-3);border:1px solid var(--rule);display:grid;place-items:center;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--ink-faint)}
.cmt .ch{font-family:var(--sans);font-size:12.5px;color:var(--ink-faint)}
.cmt .ch b{color:var(--ink-strong);font-weight:600}
.cmt p{margin:5px 0 0;font-size:16px;line-height:1.58}
.cmt .ca{display:flex;gap:14px;margin-top:8px;font-family:var(--sans);font-size:11.5px;color:var(--ink-faint)}
.cmt .ca button:hover{color:var(--ink-strong)}
.signin{margin-top:16px;font-family:var(--sans);font-size:12.5px;color:var(--ink-strong);border:1px solid var(--rule);border-radius:6px;padding:7px 14px;background:var(--card)}
.signin:hover{border-color:var(--accent)}

.cite{margin:28px 0 0;border-top:2px solid var(--ink-strong);padding-top:11px}
.cite .h{display:flex;align-items:center;font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-faint)}
.cite pre{margin:8px 0 0;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);overflow-x:auto;line-height:1.6}
.pgr{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:30px;border-top:1px solid var(--rule);padding-top:18px}
@media (max-width:700px){.pgr{grid-template-columns:1fr}}
.pgr a{color:inherit}
.pgr a:hover{text-decoration:none}
.pgr a:hover span{color:var(--accent)}
.pgr small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px}
.pgr span{font-family:var(--serif);font-size:16px;color:var(--ink-strong);line-height:1.3;display:block}

.sbox{display:flex;align-items:center;gap:11px;border-bottom:2px solid var(--ink-strong);padding:6px 0;margin-bottom:24px}
.sbox input{flex:1;border:0;outline:0;background:none;font-family:var(--serif);font-size:22px;color:var(--ink-strong)}
.sbox input::placeholder{color:var(--ink-faint)}

/* site footer */
.foot{border-top:1px solid var(--rule);margin-top:20px}
.footin{max-width:1180px;margin:0 auto;padding:20px 26px 44px;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;font-family:var(--sans);font-size:12px;color:var(--ink-faint)}
.footin .links{display:flex;gap:14px;flex-wrap:wrap}
.footin .links a{color:var(--ink-soft)}
.footin .tot{margin-left:auto;font-variant-numeric:tabular-nums}
.footin .tot b{font-family:var(--mono);color:var(--ink-soft);font-weight:500}
@media (max-width:900px){
  .page{padding:24px 16px 30px}
  .ahead h1{font-size:27px}h1.big{font-size:25px}
  .prose h2::before{display:none}
  .footin{padding:18px 16px 36px}
}
</style>

<header class="top"><div class="topin">
  <div class="mark"><a href="#/" id="mark"></a><span id="markkind"></span></div>
  <nav class="nav" id="nav"></nav>
  <div class="act">
    <button class="mini" id="searchbtn" title="Search — press /" aria-label="Search"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><circle cx="5" cy="5" r="3.6" stroke="currentColor" stroke-width="1.3"/><path d="M7.8 7.8 L11 11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <div class="lsw" id="lsw"><button data-l="en">EN</button><button data-l="zh">中</button></div>
    <button class="mini" id="themebtn" title="Toggle light and dark">◐</button>
  </div>
</div></header>

<div class="prog" id="prog" style="width:0"></div>
<main class="page" id="main"></main>
<footer class="foot"><div class="footin" id="foot"></div></footer>
<div class="hcard" id="hcard"></div>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('payload').textContent);
const S = { lang: 'en', theme: localStorage.getItem('nb-theme') || '', mode: 'read', filter: 'all' };
const T = () => D.ui[S.lang];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = id => document.getElementById(id);
const ALL_CATS = [...D.categories, D.archive];
const cat = id => ALL_CATS.find(c => c.id === id);
const ser = id => D.series.find(s => s.id === id);
const post = slug => D.posts.find(p => p.slug === slug);
const live = () => D.posts.filter(p => p.category !== 'archive');
const inSeries = id => D.posts.filter(p => p.series.some(s => s.id === id))
  .sort((a,b) => (a.series.find(s=>s.id===id).part ?? 99) - (b.series.find(s=>s.id===id).part ?? 99));
const fmt = (s,o) => Object.entries(o).reduce((a,[k,v]) => a.replace('{'+k+'}', v), s);
const shown = p => p.langs.includes(S.lang) ? S.lang : p.langs[0];
const n = x => x.toLocaleString('en-US');
const nArticles = k => k + ' ' + (k === 1 ? T().article : T().articlesN);

/* ---------------- theme, language ---------------- */
function applyTheme(){
  if (S.theme) document.documentElement.dataset.theme = S.theme;
  else delete document.documentElement.dataset.theme;
}
byId('themebtn').onclick = () => {
  // dark is the default, so the first click always goes to light
  S.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('nb-theme', S.theme);
  applyTheme();
};
applyTheme();
byId('lsw').onclick = e => { const b = e.target.closest('[data-l]'); if (b) { S.lang = b.dataset.l; render(); } };
byId('searchbtn').onclick = () => { location.hash = '#/search'; };

function route(){
  const [p, q] = location.hash.replace(/^#\/?/, '').split('?');
  const seg = p.split('/').filter(Boolean).map(decodeURIComponent);
  return { seg, q: new URLSearchParams(q || ''), kind: seg[0] || 'home' };
}
addEventListener('hashchange', () => { render(); scrollTo(0,0); });

/* ---------------- chrome ---------------- */
function chrome(){
  const t = T(), r = route();
  byId('mark').textContent = D.site.name[S.lang];
  byId('markkind').textContent = S.lang === 'zh' ? '笔记' : 'Notebook';
  const items = [['#/articles', t.articles, 'articles'], ['#/posts', t.posts, 'posts'], ['#/about', t.about, 'about']];
  const active = { p: 'articles', s: 'articles', archive: 'articles' }[r.kind] || r.kind;
  byId('nav').innerHTML = items.map(([h, l, k]) => '<a href="'+h+'"'+(k === active ? ' class="on"' : '')+'>'+esc(l)+'</a>').join('');
  byId('lsw').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === S.lang));
  byId('foot').innerHTML =
    '<div class="links">'+D.site.links.map(l => '<a href="'+l.href+'"'+(l.href.startsWith('http') ? ' target="_blank" rel="noopener"' : '')+'>'+esc(l.label)+'</a>').join('')+'</div>'+
    '<div class="tot"><b>'+n(D.stats.visits)+'</b> '+t.visits+' · '+D.stats.since+'–</div>';
  document.documentElement.lang = S.lang;
}

/* ---------------- rows ---------------- */
function itemHTML(p){
  const c = cat(p.category), sr = p.series[0] ? ser(p.series[0].id) : null, t = T();
  const bits = [
    '<span class="dot" style="background:'+c.accent+'"></span><a href="#/articles?c='+c.id+'">'+esc(c.name[S.lang])+'</a>',
    p.langs.join(' / '),
  ];
  if (p.eqns) bits.push('<span class="eq">'+p.eqns+' '+t.equations+'</span>');
  return '<div class="item"><div class="when">'+p.date+'</div><div>'+
    '<a class="t" href="#/p/'+p.slug+'">'+esc(p.title)+'</a>'+
    (p.subtitle ? '<p class="sub">'+esc(p.subtitle)+'</p>' : '')+
    '<div class="row">'+bits.join('<span class="sep">·</span>')+
    (sr ? '<a class="pill ser" href="#/s/'+sr.id+'">'+esc(sr.name[S.lang])+(p.series[0].part ? ' '+p.series[0].part : '')+'</a>' : '')+
    p.tags.map(x => '<a class="tag" href="#/articles?t='+encodeURIComponent(x)+'">'+esc(x)+'</a>').join('')+
    '</div></div></div>';
}
const stream = ps => ps.length
  ? '<div class="stream">'+ps.map(itemHTML).join('')+'</div>'
  : '<p style="color:var(--ink-faint)">'+T().noResults+'</p>';

function noteHTML(nt, compact){
  return '<div class="note"><div class="w">'+(compact ? nt.at.slice(5,10) : nt.at)+'</div>'+
    '<div class="bd" lang="'+nt.lang+'">'+nt.html+
    (nt.code && !compact ? '<pre class="code-block" data-lang="'+nt.code.lang+'" data-source="'+esc(nt.code.source)+'"><code>'+esc(nt.code.source)+'</code></pre>' : '')+
    '</div></div>';
}

/* ---------------- views ---------------- */
function viewHome(){
  const t = T();
  return '<h1 class="big">'+esc(D.site.name[S.lang])+'</h1><p class="lede">'+esc(D.site.tagline[S.lang])+'</p>'+
    '<div class="home"><div>'+
      '<div class="sechead" style="margin-top:2px"><span class="lbl">'+t.articles+'</span></div>'+
      stream(live())+
      '<a class="morelink" href="#/archive">'+t.archive+' ('+D.stats.archive+') →</a>'+
    '</div><div class="side">'+
      '<div class="sechead"><span class="lbl">'+t.posts+'</span></div>'+
      '<div class="notes">'+D.notes.map(x => noteHTML(x, true)).join('')+'</div>'+
      '<a class="morelink" href="#/posts">'+t.posts+' →</a>'+
    '</div></div>';
}

function viewArticles(q){
  const t = T();
  const byCat = q.get('c'), byTag = q.get('t');
  let list = D.posts;
  if (byCat) list = list.filter(p => p.category === byCat);
  else if (byTag) list = list.filter(p => p.tags.includes(byTag));
  else list = live();

  const chip = (id, label, count, accent, on) =>
    '<a class="chip'+(on ? ' on' : '')+'" href="'+(id ? '#/articles?c='+id : '#/articles')+'">'+
    (accent ? '<i style="background:'+accent+'"></i>' : '')+esc(label)+'<b>'+count+'</b></a>';

  let h = '<h1 class="big">'+t.articles+'</h1>'+
    '<p class="lede">'+(S.lang === 'zh'
      ? '全部长文。按主题筛选，或者直接往下看。'
      : 'Every long piece. Filter by topic, or just read down the list.')+'</p>'+
    '<div class="filters" style="margin-top:22px">'+
      chip('', t.all, D.stats.articles, null, !byCat && !byTag)+
      D.categories.map(c => chip(c.id, c.name[S.lang], D.posts.filter(p => p.category === c.id).length, c.accent, byCat === c.id)).join('')+
      chip('archive', D.archive.name[S.lang], D.stats.archive, D.archive.accent, byCat === 'archive')+
    '</div>';

  if (byTag) h += '<p class="lbl" style="margin:0 0 6px">'+t.all+' · '+esc(byTag)+'</p>';

  const cur = byCat ? cat(byCat) : null;
  if (cur) h += '<p class="lede" style="margin:0 0 6px;font-size:16px">'+esc(cur.blurb[S.lang])+'</p>';

  const seriesHere = D.series.filter(s => byCat ? s.category === byCat : s.category !== 'archive');
  if (seriesHere.length) {
    h += '<div class="sechead" style="margin-top:26px"><span class="lbl">'+t.series+'</span></div><div class="cards">'+
      seriesHere.map(s => '<a class="card" href="#/s/'+s.id+'"><span class="n">'+inSeries(s.id).length+'</span>'+
        '<h3>'+esc(s.name[S.lang])+'</h3><p>'+esc(s.blurb[S.lang])+'</p></a>').join('')+'</div>';
  }
  h += '<div class="sechead" style="margin-top:26px"><span class="lbl">'+nArticles(list.length)+'</span></div>' + stream(list);
  return h;
}

const viewArchive = () => '<h1 class="big">'+D.archive.name[S.lang]+'</h1>'+
  '<p class="lede">'+esc(D.archive.blurb[S.lang])+'</p>'+
  '<div class="sechead" style="margin-top:26px"><span class="lbl">'+T().series+'</span></div><div class="cards">'+
  D.series.filter(s => s.category === 'archive').map(s => '<a class="card" href="#/s/'+s.id+'"><span class="n">'+inSeries(s.id).length+'</span>'+
    '<h3>'+esc(s.name[S.lang])+'</h3><p>'+esc(s.blurb[S.lang])+'</p></a>').join('')+'</div>'+
  '<div class="sechead" style="margin-top:26px"><span class="lbl">'+nArticles(D.stats.archive)+'</span></div>'+
  stream(D.posts.filter(p => p.category === 'archive'));

function viewSeries(id){
  const s = ser(id); if (!s) return viewArticles(new URLSearchParams());
  const items = inSeries(id), t = T();
  return '<p class="lbl" style="margin:0 0 10px">'+t.series+'</p>'+
    '<h1 class="big">'+esc(s.name[S.lang])+'</h1><p class="lede">'+esc(s.blurb[S.lang])+'</p>'+
    '<div class="sechead" style="margin-top:26px"><span class="lbl">'+(S.lang==='zh'?'阅读顺序':'Reading order')+'</span></div>'+
    stream(items);
}

const viewPosts = () => '<h1 class="big">'+T().posts+'</h1>'+
  '<p class="lede">'+(S.lang === 'zh'
    ? '短的东西放在这里，一个想法、一个坑、一段值得留着的代码。每一条都是一个 markdown 文件，所以它们和文章一起出现在搜索结果里。'
    : 'The short things. A half-thought, a bug that cost a day, a snippet worth keeping. Each one is a markdown file, so they turn up in search next to the articles.')+'</p>'+
  '<div style="max-width:62ch;margin-top:24px"><div class="notes">'+D.notes.map(x => noteHTML(x, false)).join('')+'</div></div>';

function searchAll(q){
  const needle = q.toLowerCase().trim();
  if (!needle) return { posts: [], notes: [] };
  const hit = s => String(s).toLowerCase().includes(needle);
  return {
    posts: D.posts.filter(p => hit(p.title) || hit(p.subtitle) || hit(p.excerpt) || p.tags.some(hit)),
    notes: D.notes.filter(x => hit(x.body)),
  };
}
function viewSearch(q){
  const t = T(), r = searchAll(q);
  return '<div class="sbox"><span class="lbl">'+t.search+'</span>'+
    '<input id="q" value="'+esc(q)+'" placeholder="'+esc(t.searchPlaceholder)+'" autocomplete="off"></div>'+
    (q ? '<p class="lbl" style="margin:0 0 12px">'+nArticles(r.posts.length)+' · '+r.notes.length+' '+t.notesN+'</p>'+
      stream(r.posts)+(r.notes.length ? '<div class="sechead" style="margin-top:26px"><span class="lbl">'+t.posts+'</span></div>'+
      '<div style="max-width:62ch"><div class="notes">'+r.notes.map(x => noteHTML(x, false)).join('')+'</div></div>' : '')
     : '<p class="lede">'+(S.lang === 'zh' ? '搜索会覆盖全部文章和短文。' : 'Search covers every article and every short post.')+'</p>');
}

function viewAbout(){
  const zh = S.lang === 'zh';
  return '<h1 class="big">'+T().about+'</h1>'+
    '<div class="doc2"><div class="prose" style="counter-reset:sn" lang="'+S.lang+'">'+
    '<p>'+(zh
      ? '我写一些偏长的笔记，大多是关于机器学习系统到底怎么运转的，偶尔也写一首曲子到底是怎么写成的。这里的东西大部分最初是写给自己看的，用来确认自己真的弄懂了<span class="sn"></span>。'
      : 'I write long notes, mostly about how machine-learning systems actually work, and occasionally about how a piece of music actually works. Most of it started as something I wrote for myself, to check that I had understood it<span class="sn"></span>.')+
    '<span class="snote"><b>1.</b> '+(zh
      ? '判断标准很简单：如果我没办法在纸上把一件事讲清楚，那我大概就是没懂。'
      : 'The test is simple. If I cannot get it down on the page, I did not understand it.')+'</span></p>'+
    '<p>'+(zh
      ? '写得最多的是后训练和模型效率这两块。音乐那部分是把谱子和音频直接放进文章里，一个小节一个小节地看<span class="sn"></span>。'
      : 'Mostly that means post-training and model efficiency. The music pieces put the stave and the audio straight into the page and go through a bar at a time<span class="sn"></span>.')+
    '<span class="snote"><b>2.</b> '+(zh
      ? '目前是泽野弘之的两首曲子。'
      : 'Two Hiroyuki Sawano pieces so far.')+'</span></p>'+
    '<h2>'+(zh?'这个站是怎么搭的':'How the site is built')+'</h2><ul>'+
    '<li>'+(zh?'公式在构建时就被 KaTeX 渲染成静态 HTML，浏览器一个字节的数学脚本都不用下载。':'Equations are rendered to static HTML by KaTeX at build time. The browser downloads no math JavaScript at all.')+'</li>'+
    '<li>'+(zh?'代码高亮同样在构建时完成，深色和浅色两套配色被写进同一份产物。':'Highlighting happens at build time too, with both colour schemes baked into one artifact.')+'</li>'+
    '<li>'+(zh?'每篇文章的每种语言都有独立地址，因此深层链接和搜索引擎都不会出问题。':'Every language of every article has its own URL, so deep links and search engines both behave.')+'</li>'+
    '<li>'+(zh?'默认是深色。右上角那个按钮可以切成浅色，选择会被记住。':'Dark by default. The button in the corner switches to light, and the choice is remembered.')+'</li>'+
    '</ul></div><aside></aside></div>';
}

/* ---------------- article ---------------- */
function bodyFor(p){
  const key = p.slug === 'grpo' ? 'grpo' : (p.slug === 'decorators' ? 'decorators' : null);
  if (!key) return null;
  const b = D.bodies[key];
  return b[shown(p)] || b[p.langs[0]] || null;
}

function commentsHTML(){
  const t = T();
  return '<section class="cmts"><h3>'+t.comments+' <span style="color:var(--ink-faint);font-family:var(--mono);font-size:14px">'+D.comments.length+'</span></h3>'+
    '<p class="cn">'+(S.lang === 'zh'
      ? '这是评论区的布局预览。真实的评论由 giscus 承载，内容存在这个仓库的 GitHub Discussions 里，不需要额外的数据库。下面两条是占位内容。'
      : 'Layout preview. Real comments would be served by giscus and stored in this repository’s GitHub Discussions, so there is no database to run. The two entries below are placeholders.')+'</p>'+
    D.comments.map(c => '<div class="cmt"><div class="av">'+esc(c.who[0].toUpperCase())+'</div><div>'+
      '<div class="ch"><b>@'+esc(c.who)+'</b> · '+esc(c.at)+'</div>'+
      '<p>'+esc(c.body)+'</p>'+
      '<div class="ca"><button type="button">♡ '+c.reactions+'</button><button type="button">'+t.reply+'</button></div>'+
      '</div></div>').join('')+
    '<button class="signin" type="button">'+t.signIn+'</button></section>';
}

function viewPost(slug){
  const p = post(slug); if (!p) return viewHome();
  const t = T(), c = cat(p.category), lang = shown(p), body = bodyFor(p);
  const idx = D.posts.indexOf(p), prev = D.posts[idx+1], next = D.posts[idx-1];

  const eqCount = body ? body.eqnCount : p.eqns;
  let h = '<div class="post">';

  h += body
    ? '<aside class="rail">'+
        (eqCount ? '<section><h6 class="lbl">'+t.equations+' ('+eqCount+')</h6><div class="eqlist" id="eqlist"></div></section>' : '')+
        '<section><h6 class="lbl">'+t.contents+'</h6><ol>'+
          body.toc.map(x => '<li class="d'+x.depth+'"><a href="#'+x.id+'" data-toc="'+x.id+'">'+esc(x.text)+'</a></li>').join('')+
        '</ol></section></aside>'
    : '<aside class="rail"></aside>';

  h += '<article><div class="ahead">'+
    '<div class="over"><a class="lbl" style="color:'+c.accent+'" href="#/articles?c='+c.id+'">'+esc(c.name[S.lang])+'</a>'+
    '<span class="lbl">'+esc(t.kind[p.kind])+'</span>'+
    p.series.map(s => '<a class="pill ser" href="#/s/'+s.id+'">'+esc(ser(s.id).name[S.lang])+
      (s.part ? ' · '+fmt(t.partOf,{n:s.part,m:inSeries(s.id).length}) : '')+'</a>').join('')+
    '</div>'+
    '<h1 lang="'+lang+'">'+esc(p.title)+'</h1>'+
    (p.subtitle ? '<p class="st" lang="'+lang+'">'+esc(p.subtitle)+'</p>' : '')+
    '<div class="ameta"><div><b>'+p.date+'</b>'+t.published+'</div>'+
    (body ? '<div><b>'+body.minutes+'</b>'+t.readingTime+'</div><div><b>'+n(body.words)+'</b>'+t.words+'</div>' : '')+
    (eqCount ? '<div><button type="button" data-scroll="eq-1"><b>'+eqCount+'</b>'+t.equations+'</button></div>' : '')+
    '<div><b>'+p.langs.join(' / ')+'</b>'+(S.lang==='zh'?'语言':'languages')+'</div></div>'+
    (lang !== S.lang ? '<p class="notice"><b>'+fmt(t.onlyIn,{lang:t.langName[lang]})+'.</b> '+
      (S.lang==='zh'?'界面仍然是中文，正文按照原文显示。':'The chrome stays in your language; the article is served in the one it exists in.')+'</p>' : '')+
    (body ? '<div class="modes"><span class="lbl" style="letter-spacing:.14em">'+t.readAs+'</span><div class="grp">'+
      ['skim','read','derive'].map(m => '<button data-mode="'+m+'"'+(S.mode===m?' class="on"':'')+'>'+t[m]+'</button>').join('')+
      '</div></div>' : '')+
    '</div>';

  h += body
    ? '<div class="prose" id="prose" lang="'+lang+'" data-mode="'+S.mode+'">'+
      '<div class="skimnote keep">'+(S.lang === 'zh'
        ? '略读视图：每节只留论点句，公式、插图和表格全部保留，推导折叠起来。'
        : 'Skim view: one claim per section, every equation, figure and table kept, derivations folded away.')+'</div>'+
      body.html+'</div>'
    : '<div class="prose"><p>'+esc(p.excerpt)+'</p><p style="font-family:var(--sans);font-size:13.5px;color:var(--ink-faint)">'+
      (S.lang==='zh' ? '这是设计预览，为了控制体积只有两篇文章被完整渲染。想看排版和公式，请打开那篇讲 PPO 与 GRPO 的文章，或者那篇讲装饰器的文章。'
                     : 'Design preview: only two articles are rendered in full to keep the file small. For the full reading view open the PPO/GRPO piece or the decorators piece.')+'</p></div>';

  h += '<div class="tally"><span><b>'+n(p.reads)+'</b> '+t.reads+'</span>'+
    '<span><b>'+D.comments.length+'</b> '+t.comments.toLowerCase()+'</span>'+
    '<span class="src">'+(S.lang==='zh'?'占位数字':'placeholder figures')+'</span></div>';

  h += commentsHTML();

  h += '<div class="cite"><div class="h">'+t.cite+'<span style="flex:1"></span><button class="mini" data-copy-cite>'+t.copy+'</button></div>'+
    '<pre id="bib">@misc{zhang'+p.date.slice(0,4)+p.slug.replace(/-/g,'')+',\n  author = {Zhang, Yihua},\n  title  = {'+p.title.replace(/[{}]/g,'')+'},\n  year   = {'+p.date.slice(0,4)+'},\n  url    = {https://normaluhr.github.io/'+lang+'/p/'+p.slug+'}\n}</pre></div>';

  h += '<div class="pgr">'+
    (prev ? '<a href="#/p/'+prev.slug+'"><small>← '+t.older+'</small><span>'+esc(prev.title)+'</span></a>' : '<div></div>')+
    (next ? '<a href="#/p/'+next.slug+'" style="text-align:right"><small>'+t.newer+' →</small><span>'+esc(next.title)+'</span></a>' : '')+
    '</div></article>';

  h += '<aside class="marg">'+
    (p.tags.length ? '<div class="blk">'+p.tags.map(x => '<a class="tag" href="#/articles?t='+encodeURIComponent(x)+'">'+esc(x)+'</a>').join('<br>')+'</div>' : '')+
    '</aside></div>';
  return h;
}

/* ---------------- interactive figure ---------------- */
function clipFigure(){
  const zh = S.lang === 'zh';
  return '<figure class="figure" id="fig-clip">'+
    '<div class="fh"><span>'+(zh?'图 1':'Figure 1')+'</span><span class="sp"></span><em>'+(zh?'可交互':'interactive')+'</em></div>'+
    '<div class="fb"><svg viewBox="0 0 660 320" role="img" aria-label="PPO clipped surrogate objective against the probability ratio"><g id="clip-g"></g></svg></div>'+
    '<div class="ctrls">'+
      '<div class="ctrl"><label>ε <b id="clip-eps">0.20</b></label><input type="range" id="clip-eps-i" min="2" max="60" value="20"></div>'+
      '<div class="ctrl"><label>'+(zh?'优势 A':'advantage A')+' <b id="clip-a">+1.0</b></label><input type="range" id="clip-a-i" min="-20" max="20" value="10"></div>'+
    '</div><div class="legend">'+
      '<button data-series="unclipped" aria-pressed="true"><i style="background:var(--ink-faint)"></i>r·A '+(zh?'未裁剪':'unclipped')+'</button>'+
      '<button data-series="clipped" aria-pressed="true"><i style="background:var(--accent)"></i>'+(zh?'PPO 目标':'PPO objective')+'</button>'+
      '<button data-series="band" aria-pressed="true"><i style="background:var(--vermilion)"></i>'+(zh?'信任区间':'trust band')+'</button>'+
    '</div><figcaption class="figcap">'+(zh
      ? '<b>把 A 拖到负数看一眼。</b>裁剪并不对称。优势为正时，PPO 给上涨的一侧封了顶，一次更新就没办法把策略推得太远；优势为负时，被封住的换成了下跌的一侧。这正是 <a class="xref" href="#eq-4" data-eq="4">公式 (4)</a> 要取 min 而不是直接裁剪的原因。'
      : '<b>Drag A negative.</b> The clip is not symmetric. With positive advantage PPO caps the upside, so a single update cannot push the policy far; with negative advantage it caps the downside instead. That is exactly why <a class="xref" href="#eq-4" data-eq="4">Eq. (4)</a> takes a min rather than simply clipping.')+
    '</figcaption></figure>';
}
function drawClip(){
  const g = byId('clip-g'); if (!g) return;
  const W = 660, H = 320, P = { l: 46, r: 34, t: 24, b: 38 };
  const eps = Number(byId('clip-eps-i').value) / 100, A = Number(byId('clip-a-i').value) / 10;
  byId('clip-eps').textContent = eps.toFixed(2);
  byId('clip-a').textContent = (A >= 0 ? '+' : '') + A.toFixed(1);
  const on = k => document.querySelector('#fig-clip [data-series="'+k+'"]').getAttribute('aria-pressed') === 'true';
  const yMax = 2.6, x1 = 2.2;
  const X = r => P.l + r / x1 * (W - P.l - P.r), Y = v => P.t + (yMax - v) / (2*yMax) * (H - P.t - P.b);
  const obj = r => Math.min(r*A, Math.min(Math.max(r, 1-eps), 1+eps) * A);
  const pathOf = f => { let d = ''; for (let i = 0; i <= 200; i++) { const r = x1*i/200, v = Math.max(-yMax, Math.min(yMax, f(r))); d += (i?'L':'M')+X(r).toFixed(1)+' '+Y(v).toFixed(1); } return d; };
  const F = 'font-family="IBM Plex Mono, monospace" font-size="10"';
  let s = '';
  for (let v = -2; v <= 2; v++) s += '<line x1="'+P.l+'" y1="'+Y(v)+'" x2="'+(W-P.r)+'" y2="'+Y(v)+'" stroke="var(--rule-hair)"/>'+
    '<text x="'+(P.l-7)+'" y="'+(Y(v)+3.5)+'" text-anchor="end" fill="var(--ink-faint)" '+F+'>'+v+'</text>';
  for (let r = 0; r <= 2; r += 0.5) s += '<text x="'+X(r)+'" y="'+(H-P.b+15)+'" text-anchor="middle" fill="var(--ink-faint)" '+F+'>'+r.toFixed(1)+'</text>';
  s += '<line x1="'+P.l+'" y1="'+Y(0)+'" x2="'+(W-P.r)+'" y2="'+Y(0)+'" stroke="var(--ink-faint)"/>'+
    '<line x1="'+P.l+'" y1="'+P.t+'" x2="'+P.l+'" y2="'+(H-P.b)+'" stroke="var(--ink-faint)"/>'+
    '<text x="'+(W-P.r)+'" y="'+(H-P.b+30)+'" text-anchor="end" fill="var(--ink-soft)" '+F+'>ratio  r = π_θ / π_old</text>';
  if (on('band')) s += '<rect x="'+X(1-eps)+'" y="'+P.t+'" width="'+(X(1+eps)-X(1-eps))+'" height="'+(H-P.t-P.b)+'" fill="var(--vermilion)" opacity=".1"/>'+
    '<line x1="'+X(1-eps)+'" y1="'+P.t+'" x2="'+X(1-eps)+'" y2="'+(H-P.b)+'" stroke="var(--vermilion)" stroke-dasharray="3 3"/>'+
    '<line x1="'+X(1+eps)+'" y1="'+P.t+'" x2="'+X(1+eps)+'" y2="'+(H-P.b)+'" stroke="var(--vermilion)" stroke-dasharray="3 3"/>'+
    '<text x="'+(X(1-eps)-4)+'" y="'+(P.t-5)+'" text-anchor="end" fill="var(--vermilion)" '+F+'>1−ε</text>'+
    '<text x="'+(X(1+eps)+4)+'" y="'+(P.t-5)+'" fill="var(--vermilion)" '+F+'>1+ε</text>';
  if (on('unclipped')) s += '<path d="'+pathOf(r => r*A)+'" fill="none" stroke="var(--ink-faint)" stroke-width="1.4" stroke-dasharray="5 4"/>';
  if (on('clipped')) s += '<path d="'+pathOf(obj)+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>';
  s += '<circle cx="'+X(1)+'" cy="'+Y(A)+'" r="3.2" fill="var(--vermilion)"/>';
  g.innerHTML = s;
}

/* ---------------- wiring ---------------- */
function mountFigures(root){
  root.querySelectorAll('[data-figure="ppo-clip"]').forEach(el => { el.outerHTML = clipFigure(); });
  const fig = byId('fig-clip'); if (!fig) return;
  fig.querySelectorAll('input[type=range]').forEach(i => i.addEventListener('input', drawClip));
  fig.querySelectorAll('.legend button').forEach(b => b.addEventListener('click', () => {
    const wasOn = b.getAttribute('aria-pressed') === 'true';
    b.setAttribute('aria-pressed', String(!wasOn));
    b.classList.toggle('off', wasOn);
    drawClip();
  }));
  drawClip();
}
function wrapTables(root){
  root.querySelectorAll('.prose > table').forEach(tb => {
    const w = document.createElement('div'); w.className = 'tablewrap';
    tb.parentNode.insertBefore(w, tb); w.appendChild(tb);
  });
}
function wireCopy(root){
  root.querySelectorAll('.code-block').forEach(pre => {
    if (pre.querySelector('.copybtn')) return;
    const b = document.createElement('button');
    b.className = 'copybtn'; b.textContent = T().copy;
    b.onclick = async () => {
      try { await navigator.clipboard.writeText(pre.dataset.source || pre.textContent); } catch { return; }
      b.textContent = T().copied; b.classList.add('ok');
      setTimeout(() => { b.textContent = T().copy; b.classList.remove('ok'); }, 1400);
    };
    pre.appendChild(b);
  });
  const cb = root.querySelector('[data-copy-cite]');
  if (cb) cb.onclick = async () => {
    try { await navigator.clipboard.writeText(byId('bib').textContent); } catch { return; }
    cb.textContent = T().copied; setTimeout(() => cb.textContent = T().copy, 1400);
  };
}
/** Skim keeps the spine: every heading, the first paragraph under it, every equation, figure and table. */
function markSkim(prose){
  let afterHeading = false;
  [...prose.children].forEach(el => {
    const tag = el.tagName.toLowerCase();
    if (/^h[1-4]$/.test(tag)) { el.classList.add('keep'); afterHeading = true; return; }
    if (el.classList.contains('eqn') || el.classList.contains('tablewrap') || el.classList.contains('figure') || tag === 'figure') {
      el.classList.add('keep'); return;
    }
    if (afterHeading && tag === 'p') { el.classList.add('keep'); afterHeading = false; }
  });
}
function applyMode(){
  const prose = byId('prose'); if (!prose) return;
  prose.dataset.mode = S.mode;
  prose.querySelectorAll('details.deeper').forEach(d => { d.open = S.mode !== 'skim'; });
  prose.querySelectorAll('.eqn').forEach(eq => {
    let tex = eq.querySelector('.texsrc');
    if (S.mode !== 'derive') { if (tex) tex.remove(); return; }
    if (tex) return;
    const src = eq.querySelector('annotation[encoding="application/x-tex"]');
    if (!src) return;
    tex = document.createElement('pre');
    tex.className = 'texsrc';
    tex.textContent = src.textContent.trim();
    eq.appendChild(tex);
  });
}
function wireModes(root){
  root.querySelectorAll('button[data-mode]').forEach(b => b.onclick = () => {
    S.mode = b.dataset.mode;
    root.querySelectorAll('button[data-mode]').forEach(x => x.classList.toggle('on', x.dataset.mode === S.mode));
    applyMode();
  });
}
function flash(id){
  const el = document.getElementById(id); if (!el) return;
  el.scrollIntoView({ block: 'center' });
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), 1100);
}
function wireScrollTo(root){
  root.querySelectorAll('[data-scroll]').forEach(b => b.onclick = () => flash(b.dataset.scroll));
  root.querySelectorAll('a[data-eq]').forEach(a => a.onclick = e => { e.preventDefault(); flash('eq-' + a.dataset.eq); });
}
/** Turn "Eq. (n)" / "公式 (n)" in the prose into hovercard cross-references. */
function linkCrossRefs(prose){
  const re = /(Eq\.?|Equation|公式)\s*\((\d+)\)/g;
  const walker = document.createTreeWalker(prose, NodeFilter.SHOW_TEXT);
  const hits = [];
  for (let node = walker.nextNode(); node; node = walker.nextNode()) {
    if (node.parentElement.closest('a,.katex,pre')) continue;
    if (re.test(node.nodeValue)) hits.push(node);
    re.lastIndex = 0;
  }
  hits.forEach(node => {
    const span = document.createElement('span');
    span.innerHTML = esc(node.nodeValue).replace(re, (m, w, k) => '<a class="xref" href="#eq-'+k+'" data-eq="'+k+'">'+m+'</a>');
    node.parentNode.replaceChild(span, node);
  });
}
function wireHovercards(root){
  const card = byId('hcard');
  const show = a => {
    const eq = document.getElementById('eq-' + a.dataset.eq);
    const katex = eq && eq.querySelector('.katex-display');
    if (!katex) return;
    card.innerHTML = '<div class="cl">'+(S.lang==='zh'?'公式':'Equation')+' ('+a.dataset.eq+')</div><div>'+katex.outerHTML+'</div>';
    card.classList.add('on');
    const r = a.getBoundingClientRect(), cr = card.getBoundingClientRect();
    card.style.left = Math.max(10, Math.min(innerWidth - cr.width - 10, r.left)) + 'px';
    card.style.top = (r.top > cr.height + 18 ? r.top - cr.height - 10 : r.bottom + 10) + 'px';
  };
  root.querySelectorAll('a.xref').forEach(a => {
    a.addEventListener('mouseenter', () => show(a));
    a.addEventListener('focus', () => show(a));
    a.addEventListener('mouseleave', () => card.classList.remove('on'));
    a.addEventListener('blur', () => card.classList.remove('on'));
  });
}
function fillEqList(){
  const box = byId('eqlist'), prose = byId('prose');
  if (!box || !prose) return;
  box.innerHTML = [...prose.querySelectorAll('.eqn')].map(eq => {
    const k = eq.querySelector('.katex-display');
    return '<a href="#'+eq.id+'"><span class="n">('+eq.dataset.eqn+')</span><span class="k">'+(k ? k.innerHTML : '')+'</span></a>';
  }).join('');
}
let scrollHandler = null;
function wireScroll(){
  if (scrollHandler) removeEventListener('scroll', scrollHandler);
  const links = [...document.querySelectorAll('[data-toc]')], prog = byId('prog');
  scrollHandler = () => {
    const h = document.documentElement;
    prog.style.width = (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight) * 100) + '%';
    if (!links.length) return;
    let cur = links[0];
    for (const a of links) {
      const el = document.getElementById(a.dataset.toc);
      if (el && el.getBoundingClientRect().top < 150) cur = a;
    }
    links.forEach(a => a.classList.toggle('cur', a === cur));
  };
  addEventListener('scroll', scrollHandler, { passive: true });
  scrollHandler();
}

/* ---------------- render ---------------- */
function render(){
  const r = route();
  chrome();
  const main = byId('main');
  const view = {
    home: viewHome,
    articles: () => viewArticles(r.q),
    posts: viewPosts,
    archive: viewArchive,
    s: () => viewSeries(r.seg[1]),
    p: () => viewPost(r.seg[1]),
    about: viewAbout,
    search: () => viewSearch(r.q.get('q') || ''),
  }[r.kind] || viewHome;
  main.innerHTML = view();

  wrapTables(main);
  mountFigures(main);
  const prose = byId('prose');
  if (prose) { markSkim(prose); linkCrossRefs(prose); applyMode(); fillEqList(); }
  wireCopy(main); wireModes(main); wireScrollTo(main); wireHovercards(document); wireScroll();

  const q = byId('q');
  if (q) {
    q.focus();
    let timer;
    q.oninput = () => {
      clearTimeout(timer);
      timer = setTimeout(() => { history.replaceState(null, '', '#/search?q=' + encodeURIComponent(q.value)); render(); }, 220);
    };
  }
  // deep link support: #/p/grpo?at=eq-4
  const at = r.q.get('at');
  if (at) requestAnimationFrame(() => flash(at));
}

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); location.hash = '#/search'; }
  if (e.key === 't') byId('themebtn').click();
  if (e.key === '1' || e.key === '2' || e.key === '3') {
    const b = document.querySelectorAll('button[data-mode]')[Number(e.key)-1];
    if (b) b.click();
  }
});

render();
</script>
