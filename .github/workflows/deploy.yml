# Builds site/ and publishes it to GitHub Pages.
#
# Runs on every push rather than only on pushes that touch site/. The build reads from
# site/ but also from img/ and videos/ through symlinks, and a redundant build costs
# less than a push that quietly fails to publish.
name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # Media lives at the repository root and is symlinked into site/public.
      # Recreate the links after checkout so the build picks them up.
      - name: Link media
        run: |
          ln -sfn ../../img site/public/img
          ln -sfn ../../videos site/public/videos
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
