# Builds site/ and publishes it to GitHub Pages.
#
# Runs on every push rather than only on pushes that touch site/. Pages is still set to
# deploy from the branch, so the legacy builder runs alongside this workflow, and a push
# this one ignored would leave that builder's output as the only deployment.
name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # Media lives at the repository root and is symlinked into site/public.
      # Recreate the links after checkout so the build picks them up.
      - name: Link media
        run: |
          ln -sfn ../../img site/public/img
          ln -sfn ../../videos site/public/videos
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # TEMPORARY. Settings -> Pages -> Source is still "Deploy from a branch", so the
      # legacy builder also runs on every push and whichever deployment lands last is
      # the one served. It takes about 100s; this build takes about 85s, so without a
      # wait its output wins, and with the Jekyll theme gone that output has no index
      # at the root. Switch Source to "GitHub Actions" and delete this step: the legacy
      # builder stops running and the wait becomes dead weight.
      - name: Wait out the legacy Pages build
        run: sleep 75
      - id: deploy
        uses: actions/deploy-pages@v4
